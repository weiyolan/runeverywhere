# Supabase local development config — https://supabase.com/docs/guides/local-development/cli/config
project_id = "runeverywhere"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "runeverywhere://"
additional_redirect_urls = ["runeverywhere://**", "https://runeverywhere.expo.app/**", "http://localhost:8082/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.email]
enable_signup = true
enable_confirmations = false # enable in hosted project for production
# Pinned to hosted values so `supabase config push` doesn't weaken them.
max_frequency = "1m0s"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "10MiB"

# Vector buckets are paid-tier; the CLI default (on) makes `config push` 402.
[storage.vector]
enabled = false

[edge_runtime]
enabled = true

# P5 Edge Functions: the live-share page is public (token is the auth);
# delete-account requires the caller's JWT.
[functions.live-share-page]
verify_jwt = false

[functions.delete-account]
verify_jwt = true
